name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Show every service's result, don't cancel the rest on the first failure.
      fail-fast: false
      matrix:
        dir: [monolith, services/gateway, services/broker, services/catalog, services/order, services/payment, services/notification, services/traces, services/feed]
    defaults: { run: { working-directory: "${{ matrix.dir }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  # Production runs on Postgres (Neon), so every service that owns a database
  # is also tested against a real Postgres: locking, timestamps and unique
  # violations behave differently from SQLite (ADR 0006).
  postgres:
    runs-on: ubuntu-latest
    strategy:
      # Show every service's result, don't cancel the rest on the first failure.
      fail-fast: false
      matrix:
        dir: [services/catalog, services/order, services/payment, services/notification]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults: { run: { working-directory: "${{ matrix.dir }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
