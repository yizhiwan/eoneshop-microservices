# Services talk through events via pubsub-lite (a local Pub/Sub stand-in).
# Only the gateway is published to the host: http://localhost:8080 is the live
# visualizer. Builds use the repo root as context so every image can include
# the shared/ event plumbing.
x-service: &service
  environment: &env
    BROKER_URL: http://broker:8080
    OTEL_EXPORTER_OTLP_ENDPOINT: http://traces:8080
    OTEL_BSP_SCHEDULE_DELAY: "500"
services:
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      CATALOG_URL: http://catalog:8080
      ORDER_URL: http://order:8080
      PAYMENT_URL: http://payment:8080
      NOTIFICATION_URL: http://notification:8080
      FEED_URL: http://feed:8080
      BROKER_URL: http://broker:8080
      TRACES_URL: http://traces:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://traces:8080
  broker:
    build: { context: ., dockerfile: services/broker/Dockerfile }
    environment:
      # Set to 1 to deliver every message twice and watch idempotency hold.
      DUPLICATE_RATE: "0"
      DEAD_LETTER_URL: http://feed:8080/pubsub/push
      # topic=url#name: the name makes subscriptions "<topic>--<name>" like in production.
      SUBSCRIPTIONS: >-
        order.created=http://catalog:8080/pubsub/push#catalog,
        stock.reserved=http://payment:8080/pubsub/push#payment,
        stock.rejected=http://order:8080/pubsub/push#order,
        payment.succeeded=http://order:8080/pubsub/push#order,
        payment.failed=http://order:8080/pubsub/push#order,
        order.completed=http://notification:8080/pubsub/push#notification,
        order.cancelled=http://notification:8080/pubsub/push#notification,
        order.cancelled=http://catalog:8080/pubsub/push#catalog,
        order.cancelled=http://payment:8080/pubsub/push#payment,
        order.created=http://feed:8080/pubsub/push#feed,
        stock.reserved=http://feed:8080/pubsub/push#feed,
        stock.rejected=http://feed:8080/pubsub/push#feed,
        stock.released=http://feed:8080/pubsub/push#feed,
        payment.succeeded=http://feed:8080/pubsub/push#feed,
        payment.failed=http://feed:8080/pubsub/push#feed,
        payment.refunded=http://feed:8080/pubsub/push#feed,
        order.completed=http://feed:8080/pubsub/push#feed,
        order.cancelled=http://feed:8080/pubsub/push#feed
  traces:
    build: { context: ., dockerfile: services/traces/Dockerfile }
  feed:
    build: { context: ., dockerfile: services/feed/Dockerfile }
  catalog:
    <<: *service
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      <<: *env
      RESTOCK_BELOW: "2"
  order:
    <<: *service
    build: { context: ., dockerfile: services/order/Dockerfile }
  payment:
    <<: *service
    build: { context: ., dockerfile: services/payment/Dockerfile }
  notification:
    <<: *service
    build: { context: ., dockerfile: services/notification/Dockerfile }
